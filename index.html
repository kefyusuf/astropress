<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AstroPress — Astro tabanlı agent-native CMS prototipi</title>
<style>html,body{margin:0;padding:0;background:light-dark(#f2f1f9,#0d0b1c);color-scheme:light dark}</style>
</head>
<body>
<div id="astropress-root" class="ap">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="ap-i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.8"/></symbol>
<symbol id="ap-i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 12h6M10 16h6"/></symbol>
<symbol id="ap-i-bot" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V4.5"/><circle cx="12" cy="3.5" r="1.2"/><path d="M9.5 12.5v1.5M14.5 12.5v1.5"/><path d="M9.5 16.5h5"/></symbol>
<symbol id="ap-i-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/><circle cx="18.5" cy="12" r="2.2"/></symbol>
<symbol id="ap-i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.6 0 2.2-1 1.6-2.2-.7-1.4.2-2.8 1.8-2.8H17a4.5 4.5 0 0 0 4.5-4.5C21.5 6.8 17.3 3 12 3z"/><circle cx="7.8" cy="10.5" r="1.1"/><circle cx="12" cy="7.6" r="1.1"/><circle cx="16.2" cy="10.5" r="1.1"/></symbol>
<symbol id="ap-i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="ap-i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></symbol>
<symbol id="ap-i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="ap-i-check" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></symbol>
<symbol id="ap-i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="ap-i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 14h9l1-14"/><path d="M10 11v6M14 11v6"/></symbol>
<symbol id="ap-i-edit" viewBox="0 0 24 24"><path d="M4 20l4.5-1L20 7.5 16.5 4 5 15.5z"/><path d="M13.5 7l3.5 3.5"/></symbol>
<symbol id="ap-i-play" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z"/></symbol>
<symbol id="ap-i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
<symbol id="ap-i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4.5"/></symbol>
<symbol id="ap-i-zap" viewBox="0 0 24 24"><path d="M13 2L4.5 14H11l-1 8 8.5-12H12z"/></symbol>
<symbol id="ap-i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18-3-4-3-14.5 0-18z"/></symbol>
<symbol id="ap-i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
<symbol id="ap-i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
<symbol id="ap-i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/></symbol>
<symbol id="ap-i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="ap-i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></symbol>
<symbol id="ap-i-spark" viewBox="0 0 24 24"><path d="M12 2.5l2.1 7.4 7.4 2.1-7.4 2.1L12 21.5l-2.1-7.4-7.4-2.1 7.4-2.1z"/></symbol>
<symbol id="ap-i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
<symbol id="ap-i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></symbol>
<symbol id="ap-i-warn" viewBox="0 0 24 24"><path d="M12 3.5L22 20H2z"/><path d="M12 9.5v5"/><circle cx="12" cy="17" r=".6"/></symbol>
<symbol id="ap-i-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6.5 20v-7M12 20V5.5M17.5 20v-10"/></symbol>
<symbol id="ap-i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="ap-i-coffee" viewBox="0 0 24 24"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2.5c0 1.2-1 1.3-1 2.5M12 2.5c0 1.2-1 1.3-1 2.5"/></symbol>
<symbol id="ap-i-cart" viewBox="0 0 24 24"><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.4 12h10.2L20 8H6"/></symbol>
<symbol id="ap-i-sliders" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></symbol>
</defs>
</svg>

<div class="ap-shell">
  <aside class="ap-side">
    <div class="ap-brand">
      <span class="ap-brand-mark"><svg class="ap-ic" aria-hidden="true"><use href="#ap-i-zap"/></svg></span>
      <span class="ap-brand-txt"><strong>AstroPress</strong><small>agent-native CMS</small></span>
    </div>
    <nav class="ap-nav" aria-label="Yönetim menüsü">
      <button type="button" class="ap-nav-btn active" data-action="nav" data-view="dashboard"><svg class="ap-ic" aria-hidden="true"><use href="#ap-i-dash"/></svg>Genel Bakış</button>
      <button type="button" class="ap-nav-btn" data-action="nav" data-view="content"><svg class="ap-ic" aria-hidden="true"><use href="#ap-i-doc"/></svg>İçerik</button>
      <button type="button" class="ap-nav-btn" data-action="nav" data-view="agents"><svg class="ap-ic" aria-hidden="true"><use href="#ap-i-bot"/></svg>Agent'lar</button>
      <button type="button" class="ap-nav-btn" data-action="nav" data-view="tasks"><svg class="ap-ic" aria-hidden="true"><use href="#ap-i-queue"/></svg>Görev Kuyruğu<span class="ap-nav-badge" id="ap-badge-tasks">2</span></button>
      <button type="button" class="ap-nav-btn" data-action="nav" data-view="studio"><svg class="ap-ic" aria-hidden="true"><use href="#ap-i-palette"/></svg>Site Stüdyosu</button>
    </nav>
    <div class="ap-side-note">
      <div class="ap-side-note-h"><svg class="ap-ic" aria-hidden="true"><use href="#ap-i-shield"/></svg>Guardrail aktif</div>
      <p>Yayınlama ve fiyat değişiklikleri insan onayı olmadan uygulanmaz.</p>
    </div>
    <div class="ap-side-build" id="ap-side-build"></div>
  </aside>

  <div class="ap-main">
    <header class="ap-top">
      <div class="ap-site-chip">
        <span class="ap-site-dot"></span>
        <span class="ap-site-name">Köz Kahve</span>
        <span class="ap-site-dom">kozkahve.com · Astro v5 · statik çıktı</span>
      </div>
      <div class="ap-cmd">
        <svg class="ap-ic ap-cmd-ic" aria-hidden="true"><use href="#ap-i-spark"/></svg>
        <input id="ap-cmd-input" class="ap-cmd-input" type="text" autocomplete="off"
          placeholder="Agent'a komut ver… örn. «yeni yazı: soğuk demleme rehberi»" aria-label="Agent komutu">
        <button type="button" class="ap-btn ap-btn-primary ap-btn-sm" data-action="cmd-run">Çalıştır</button>
      </div>
      <button type="button" class="ap-btn" data-action="build" id="ap-top-build"><svg class="ap-ic" aria-hidden="true"><use href="#ap-i-zap"/></svg><span>Build Al</span></button>
    </header>
    <div class="ap-cmd-chips" id="ap-cmd-chips">
      <span class="ap-cmd-chips-l">Hızlı komut:</span>
      <button type="button" class="ap-chip" data-action="cmd-chip" data-cmd="yeni yazı: evde espresso demleme">+ Blog yazısı</button>
      <button type="button" class="ap-chip" data-action="cmd-chip" data-cmd="seo denetimi yap">SEO denetimi</button>
      <button type="button" class="ap-chip" data-action="cmd-chip" data-cmd="ürünleri Trendyol ile senkronla">Pazaryeri senkron</button>
      <button type="button" class="ap-chip" data-action="cmd-chip" data-cmd="içerikleri ingilizceye çevir">TR→EN çeviri</button>
      <button type="button" class="ap-chip" data-action="cmd-chip" data-cmd="haftalık durum raporu ver">Haftalık rapor</button>
    </div>
    <main class="ap-content" id="ap-view"></main>
  </div>
</div>
<div class="ap-toasts" id="ap-toasts" aria-live="polite"></div>

<style>
#astropress-root{
  --ap-bg:light-dark(#f2f1f9,#0d0b1c);
  --ap-surface:light-dark(#ffffff,#161331);
  --ap-surface2:light-dark(#f7f6fd,#1c1840);
  --ap-inset:light-dark(#efedf9,#120f28);
  --ap-border:light-dark(#e3e0f1,#2b2654);
  --ap-border2:light-dark(#d5d1ea,#3a3370);
  --ap-text:light-dark(#201c3a,#edebfc);
  --ap-muted:light-dark(#6e6890,#9c96c4);
  --ap-primary:light-dark(#6a58e0,#8f7ff8);
  --ap-primary-soft:light-dark(#ebe8fc,#292357);
  --ap-flame:light-dark(#ee6420,#ff8a4c);
  --ap-flame-soft:light-dark(#fdeadd,#3b2417);
  --ap-blue:light-dark(#2486dd,#5cb6f8);
  --ap-green:light-dark(#178f5f,#3ed598);
  --ap-green-soft:light-dark(#e0f4ea,#123327);
  --ap-amber:light-dark(#c07f08,#f6b845);
  --ap-amber-soft:light-dark(#fbf0d8,#3a2d12);
  --ap-red:light-dark(#d84c4c,#f88080);
  --ap-red-soft:light-dark(#fbe7e7,#3c1d22);
  --ap-magenta:light-dark(#cf4796,#f280be);
  --ap-cyan:light-dark(#0f97ad,#4fd0e2);
  --ap-grad:linear-gradient(120deg,var(--ap-primary),var(--ap-flame));
  --ap-shadow:0 10px 30px light-dark(rgba(64,50,140,.10),rgba(0,0,0,.45));
  color-scheme:light dark;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:13px;line-height:1.5;color:var(--ap-text);
  background:
    radial-gradient(700px 300px at 85% -60px,light-dark(rgba(106,88,224,.14),rgba(143,127,248,.16)),transparent 70%),
    radial-gradient(520px 260px at 8% -40px,light-dark(rgba(238,100,32,.10),rgba(255,138,76,.10)),transparent 70%),
    var(--ap-bg);
  padding:14px;border-radius:18px;position:relative;
}
#astropress-root *{box-sizing:border-box}
#astropress-root ::selection{background:var(--ap-primary-soft)}
.ap-ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ap-shell{display:grid;grid-template-columns:236px minmax(0,1fr);border:1px solid var(--ap-border);border-radius:16px;overflow:hidden;background:var(--ap-surface);box-shadow:var(--ap-shadow)}
.ap-side{display:flex;flex-direction:column;gap:14px;padding:16px 12px;background:var(--ap-surface2);border-right:1px solid var(--ap-border);position:relative}
.ap-brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.ap-brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ap-grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 14px light-dark(rgba(238,100,32,.35),rgba(255,138,76,.3))}
.ap-brand-mark .ap-ic{width:18px;height:18px;fill:currentColor;stroke:none}
.ap-brand-txt{display:flex;flex-direction:column;line-height:1.2}
.ap-brand-txt strong{font-size:15px;font-weight:600;letter-spacing:-.2px}
.ap-brand-txt small{font-size:11px;color:var(--ap-muted)}
.ap-nav{display:flex;flex-direction:column;gap:3px}
.ap-nav-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ap-muted);font:inherit;font-size:13px;text-align:left;cursor:pointer;transition:background .15s,color .15s}
.ap-nav-btn:hover{background:var(--ap-inset);color:var(--ap-text)}
.ap-nav-btn.active{background:var(--ap-primary-soft);border-color:light-dark(rgba(106,88,224,.25),rgba(143,127,248,.35));color:var(--ap-text);font-weight:500}
.ap-nav-btn.active .ap-ic{color:var(--ap-primary)}
.ap-nav-badge{margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--ap-flame);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.ap-nav-badge[data-zero="1"]{display:none}
.ap-side-note{border:1px dashed var(--ap-border2);border-radius:10px;padding:10px;background:var(--ap-inset)}
.ap-side-note-h{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:500;color:var(--ap-green)}
.ap-side-note p{margin:5px 0 0;font-size:11.5px;color:var(--ap-muted)}
.ap-side-build{margin-top:auto;border:1px solid var(--ap-border);border-radius:11px;padding:11px;background:var(--ap-surface)}
.ap-main{display:flex;flex-direction:column;min-width:0}
.ap-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ap-border);background:var(--ap-surface);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.ap-site-chip{display:flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid var(--ap-border);border-radius:99px;background:var(--ap-surface2);white-space:nowrap}
.ap-site-dot{width:8px;height:8px;border-radius:99px;background:var(--ap-green);box-shadow:0 0 0 3px light-dark(rgba(23,143,95,.15),rgba(62,213,152,.18))}
.ap-site-name{font-weight:600;font-size:12.5px}
.ap-site-dom{font-size:11px;color:var(--ap-muted)}
.ap-cmd{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--ap-border2);border-radius:11px;padding:5px 6px 5px 11px;background:var(--ap-inset);transition:border-color .15s,box-shadow .15s}
.ap-cmd:focus-within{border-color:var(--ap-primary);box-shadow:0 0 0 3px light-dark(rgba(106,88,224,.15),rgba(143,127,248,.2))}
.ap-cmd-ic{color:var(--ap-flame)}
.ap-cmd-input{flex:1;min-width:60px;border:none;background:transparent;color:var(--ap-text);font:inherit;font-size:13px;padding:4px 0;outline:none}
.ap-cmd-chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--ap-border);background:var(--ap-surface2)}
.ap-cmd-chips-l{font-size:11.5px;color:var(--ap-muted)}
.ap-content{padding:18px 16px 22px;display:flex;flex-direction:column;gap:16px;animation:ap-fade .28s ease}
@keyframes ap-fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ap-h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.ap-h1 .ap-ic{width:19px;height:19px;color:var(--ap-primary)}
.ap-sub{margin:3px 0 0;font-size:12px;color:var(--ap-muted)}
.ap-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ap-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;border-radius:9px;border:1px solid var(--ap-border2);background:var(--ap-surface2);color:var(--ap-text);font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;white-space:nowrap}
.ap-btn:hover{border-color:var(--ap-primary);color:var(--ap-primary)}
.ap-btn:active{transform:scale(.97)}
.ap-btn-primary{background:var(--ap-grad);border-color:transparent;color:#fff}
.ap-btn-primary:hover{color:#fff;filter:brightness(1.07)}
.ap-btn-danger{background:var(--ap-red-soft);border-color:light-dark(rgba(216,76,76,.3),rgba(248,128,128,.3));color:var(--ap-red)}
.ap-btn-danger:hover{border-color:var(--ap-red);color:var(--ap-red)}
.ap-btn-sm{padding:5px 10px;font-size:12px}
.ap-btn[disabled]{opacity:.5;cursor:not-allowed}
.ap-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;border:1px solid var(--ap-border);background:var(--ap-surface);color:var(--ap-muted);font:inherit;font-size:11.5px;cursor:pointer;transition:all .15s}
.ap-chip:hover{border-color:var(--ap-primary);color:var(--ap-primary)}
.ap-chip.on{background:var(--ap-primary-soft);border-color:var(--ap-primary);color:var(--ap-primary);font-weight:500}
.ap-input,.ap-select,.ap-textarea{border:1px solid var(--ap-border2);border-radius:9px;background:var(--ap-inset);color:var(--ap-text);font:inherit;font-size:12.5px;padding:7px 10px;transition:border-color .15s}
.ap-input:focus,.ap-select:focus,.ap-textarea:focus{border-color:var(--ap-primary)}
.ap-textarea{resize:vertical;min-height:64px;width:100%}
.ap-input{width:100%}
.ap-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ap-stat{border:1px solid var(--ap-border);border-radius:12px;padding:13px 14px;background:var(--ap-surface);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.ap-stat:hover{transform:translateY(-2px);box-shadow:var(--ap-shadow)}
.ap-stat::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--sc,var(--ap-primary))}
.ap-stat-l{font-size:11.5px;color:var(--ap-muted);display:flex;align-items:center;gap:6px}
.ap-stat-v{font-size:23px;font-weight:600;letter-spacing:-.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.ap-stat-c{font-size:11px;margin-top:2px;color:var(--ap-muted)}
.ap-stat-c b{font-weight:500}
.ap-up{color:var(--ap-green)}.ap-warn{color:var(--ap-amber)}
.ap-grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;align-items:start}
.ap-grid2e{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.ap-panel{border:1px solid var(--ap-border);border-radius:12px;background:var(--ap-surface);overflow:hidden}
.ap-panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ap-border);background:var(--ap-surface2)}
.ap-panel-t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.ap-panel-t .ap-ic{color:var(--ap-primary)}
.ap-panel-b{padding:14px}
.ap-pipeline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--ap-border);border-radius:12px;background:linear-gradient(120deg,var(--ap-primary-soft),var(--ap-flame-soft));font-size:12px}
.ap-pipe-step{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--ap-surface);border:1px solid var(--ap-border);font-weight:500}
.ap-pipe-step .ap-ic{width:13px;height:13px;color:var(--ap-primary)}
.ap-pipe-arrow{color:var(--ap-flame);display:inline-flex;animation:ap-nudge 1.6s ease-in-out infinite}
.ap-pipe-arrow .ap-ic{width:13px;height:13px}
@keyframes ap-nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.ap-table{width:100%;border-collapse:collapse;font-size:12.5px}
.ap-table th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ap-muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--ap-border);font-weight:500;white-space:nowrap}
.ap-table td{padding:9px 10px;border-bottom:1px solid var(--ap-border);vertical-align:middle}
.ap-table tr:last-child td{border-bottom:none}
.ap-table tbody tr{transition:background .12s}
.ap-table tbody tr:hover{background:var(--ap-inset)}
.ap-row-title{font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ap-row-sub{font-size:11px;color:var(--ap-muted);margin-top:1px}

function postById(id){for(var i=0;i<state.posts.length;i++){if(state.posts[i].id===id)return state.posts[i];}return null;}

var toastTimers={};
function pushToast(msg,tone,action){var id=uid('toast');state.toasts.push({id:id,msg:msg,tone:tone||'info',action:action||null});if(state.toasts.length>4){var old=state.toasts.shift();clearTimeout(toastTimers[old.id]);delete toastTimers[old.id];}renderToasts();toastTimers[id]=setTimeout(function(){removeToast(id);},6500);}
function removeToast(id){state.toasts=state.toasts.filter(function(t){return t.id!==id;});clearTimeout(toastTimers[id]);delete toastTimers[id];renderToasts();}
function renderToasts(){var box=$('#ap-toasts');if(!box)return;box.innerHTML=state.toasts.map(function(t){var icon=t.tone==='ok'?'check':t.tone==='warn'?'warn':t.tone==='err'?'x':'spark';var act='';if(t.action){act='<button type="button" class="ap-btn ap-btn-sm" data-action="toast-action" data-tid="'+t.id+'">'+esc(t.action.label)+'</button>';}return '<div class="ap-toast '+t.tone+'">'+ic(icon)+'<span class="ap-toast-msg">'+esc(t.msg)+'</span>'+act+'<button type="button" class="ap-btn ap-btn-sm" data-action="toast-close" data-tid="'+t.id+'" aria-label="Kapat">'+ic('x')+'</button></div>';}).join('');}

function filteredPosts(){var f=state.filters;var list=state.posts.filter(function(p){if(f.status!=='all'&&p.status!==f.status)return false;if(f.type!=='all'&&p.type!==f.type)return false;if(f.q){var q=f.q.toLocaleLowerCase('tr-TR');var hay=(p.title+' '+p.excerpt+' '+p.author).toLocaleLowerCase('tr-TR');if(hay.indexOf(q)===-1)return false;}return true;});
if(f.sort==='date')list.sort(function(a,b){return b.date-a.date;});
else if(f.sort==='title')list.sort(function(a,b){return a.title.localeCompare(b.title,'tr');});
else if(f.sort==='views')list.sort(function(a,b){return b.views-a.views;});
return list;}

function contentRowsHtml(){var list=filteredPosts();if(list.length===0)return '<div class="ap-empty">Eşleşen içerik yok. Filtreleri temizleyin veya yeni içerik ekleyin.</div>';

return '<tr draggable="true" data-id="'+p.id+'"><td style="width:26px"><input type="checkbox" class="ap-check" data-action="bulk-toggle" data-id="'+p.id+'"'+checked+' aria-label="Seç: '+esc(p.title)+'"></td><td style="width:22px"><span class="ap-grip" title="Sürükleyerek sırala">'+ic('grip')+'</span></td><td><div class="ap-row-title">'+esc(p.title)+agentTag+enTag+'</div><div class="ap-row-sub">'+esc(sub)+'</div></td><td class="ap-hide-sm"><span class="ap-badgeap-b-mute">'+ic(tm.i)+tm.l+'</span></td><td>'+badgeHtml(p.status)+'</td><td class="ap-hide-sm" style="font-size:11.5px;color:var(--ap-muted)">'+esc(p.author)+'</td><td class="ap-hide-sm" style="font-variant-numeric:tabular-nums">'+p.views.toLocaleString('tr-TR')+'</td><td class="ap-hide-sm" style="font-size:11.5px;color:var(--ap-muted);white-space:nowrap">'+dstr(p.date)+'</td><td style="white-space:nowrap"><button type="button" class="ap-btn ap-btn-sm" data-action="edit-post" data-id="'+p.id+'">'+ic('edit')+'</button> <button type="button" class="ap-btn ap-btn-sm ap-btn-danger" data-action="delete-post" data-id="'+p.id+'" aria-label="Sil">'+ic('trash')+'</button></td></tr>';}).join('');
return '<table class="ap-table"><thead><tr><th><input type="checkbox" class="ap-check" data-action="bulk-all" aria-label="Tümünü seç"></th><th></th><th>Başlık</th><th class="ap-hide-sm">Tür</th><th>Durum</th><th class="ap-hide-sm">Yazar</th><th class="ap-hide-sm">Görüntülenme</th><th class="ap-hide-sm">Tarih</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';}

function editorHtml(){var isNew=state.editing==='new';var p=isNew?null:postById(state.editing);if(!isNew&&!p)return '';var v=p||{title:'',type:'post',status:'draft',excerpt:'',seo:{title:'',desc:''}};
return '<div class="ap-panel"><div class="ap-panel-h"><span class="ap-panel-t">'+ic('edit')+(isNew?'Yeni İçerik':'İçeriği Düzenle')+'</span><button type="button" class="ap-btn ap-btn-sm" data-action="cancel-edit">'+ic('x')+'</button></div><div class="ap-panel-b ap-editor">'
+'<div class="ap-field"><label for="ed-title">Başlık</label><input id="ed-title" class="ap-input" type="text" value="'+esc(v.title)+'" placeholder="İçerik başlığı"></div>'
+'<div class="ap-field-row"><div class="ap-field"><label for="ed-type">Tür</label><select id="ed-type" class="ap-select"><option value="post"'+(v.type==='post'?' selected':'')+'>Yazı</option><option value="page"'+(v.type==='page'?' selected':'')+'>Sayfa</option><option value="product"'+(v.type==='product'?' selected':'')+'>Ürün</option></select></div><div class="ap-field"><label for="ed-status">Durum</label><select id="ed-status" class="ap-select"><option value="draft"'+(v.status==='draft'?' selected':'')+'>Taslak</option><option value="review"'+(v.status==='review'?' selected':'')+'>İncelemede</option><option value="published"'+(v.status==='published'?' selected':'')+'>Yayında</option></select></div></div>'
+'<div class="ap-field"><label for="ed-excerpt">Özet</label><textarea id="ed-excerpt" class="ap-textarea" rows="3" placeholder="Kısa açıklama">'+esc(v.excerpt)+'</textarea></div>'
+'<div class="ap-field"><label for="ed-seot">SEO başlığı</label><input id="ed-seot" class="ap-input" type="text" value="'+esc(v.seo.title)+'" placeholder="Agent doldurabilir"></div>'
+'<div class="ap-field"><label for="ed-seod">Meta açıklama</label><textarea id="ed-seod" class="ap-textarea" rows="2" placeholder="Agent doldurabilir">'+esc(v.seo.desc)+'</textarea></div>'
+'<div style="display:flex;gap:7px;flex-wrap:wrap"><button type="button" class="ap-btn ap-btn-primary" data-action="save-post">'+ic('check')+'Kaydet</button>'+(p?'<button type="button" class="ap-btn" data-action="improve-post" data-id="'+p.id+'">'+ic('spark')+'SEO agent ile iyileştir</button><button type="button" class="ap-btn ap-btn-danger" data-action="delete-post" data-id="'+p.id+'">'+ic('trash')+'Sil</button>':'')+'</div>'
+'<p class="ap-sub">İpucu: yayınlama yetkisi olmayan agent’lar taslak üretir; yayına alma insan onayıyla gerçekleşir.</p>'
+'</div></div>';}

function viewContent(){var f=state.filters;var bulkN=Object.keys(state.bulk).length;
var savedChips=state.savedViews.map(function(sv){return '<button type="button" class="ap-chip'+(state.activeSaved===sv.name?' on':'')+'" data-action="saved-view" data-sv="'+esc(sv.name)+'">'+esc(sv.name)+'</button>';}).join('');
var bulkBar=bulkN>0?'<div class="ap-bulkbar"><b>'+bulkN+' içerik seçildi</b><button type="button" class="ap-btn ap-btn-sm" data-action="bulk-publish">'+ic('check')+'Yayınla</button><button type="button" class="ap-btn ap-btn-sm" data-action="bulk-draft">'+ic('doc')+'Taslağa al</button><button type="button" class="ap-btn ap-btn-sm ap-btn-danger" data-action="bulk-delete">'+ic('trash')+'Sil</button><button type="button" class="ap-btn ap-btn-sm" data-action="bulk-clear">Seçimi bırak</button></div>':'';
var listPanel='<div class="ap-panel"><div class="ap-panel-h"><span class="ap-panel-t">'+ic('doc')+'İçerikler</span><span style="font-size:11px;color:var(--ap-muted)">'+filteredPosts().length+' kayıt · satır sürükleyerek sırala</span></div><div id="ap-content-list">'+contentRowsHtml()+'</div></div>';
var inner=state.editing?'<div class="ap-split">'+listPanel+editorHtml()+'</div>':listPanel;
return '<div class="ap-head"><div><h1 class="ap-h1">'+ic('doc')+'İçerik Yönetimi</h1><p class="ap-sub">WordPress tarzı yazı/sayfa/ürün yönetimi — Astro statik çıktısına derlenir.</p></div><button type="button" class="ap-btn ap-btn-primary" data-action="new-post">'+ic('plus')+'Yeni İçerik</button></div>'
+'<div class="ap-toolbar"><input class="ap-input" type="text" data-field="q" value="'+esc(f.q)+'" placeholder="Ara: başlık, özet, yazar…" aria-label="İçerik ara"><select class="ap-select" data-field="f-status" aria-label="Durum filtresi"><option value="all"'+(f.status==='all'?' selected':'')+'>Tüm durumlar</option><option value="published"'+(f.status==='published'?' selected':'')+'>Yayında</option><option value="draft"'+(f.status==='draft'?' selected':'')+'>Taslak</option><option value="review"'+(f.status==='review'?' selected':'')+'>İncelemede</option></select><select class="ap-select" data-field="f-type" aria-label="Tür filtresi"><option value="all"'+(f.type==='all'?' selected':'')+'>Tüm türler</option><option value="post"'+(f.type==='post'?' selected':'')+'>Yazı</option><option value="page"'+(f.type==='page'?' selected':'')+'>Sayfa</option><option value="product"'+(f.type==='product'?' selected':'')+'>Ürün</option></select><select class="ap-select" data-field="f-sort" aria-label="Sıralama"><option value="date"'+(f.sort==='date'?' selected':'')+'>Tarihe göre</option><option value="title"'+(f.sort==='title'?' selected':'')+'>Başlığa göre</option><option value="views"'+(f.sort==='views'?' selected':'')+'>Görüntülenmeye göre</option><option value="manual"'+(f.sort==='manual'?' selected':'')+'>Manuel sıra</option></select></div>'
+'<div class="ap-saved"><span style="font-size:11.5px;color:var(--ap-muted)">Kayıtlı görünümler:</span>'+savedChips+'<button type="button" class="ap-chip" data-action="save-view">'+ic('plus')+'Bu görünümü kaydet</button></div>'
+bulkBar+inner;}

function permChips(a){var defs=[['create','üretim'],['edit','düzenleme'],['publish','yayınlama'],['commerce','fiyat/stok']];return defs.map(function(d){var has=a.perms[d[0]];var cls=has?'ok':'gate';var icon=has?'check':'lock';return '<span class="ap-perm '+cls+'">'+ic(icon)+d[1]+'</span>';}).join('');}

function agentCardHtml(a){var st=a.status==='active'?'<span class="ap-badgeap-b-green"><span class="ap-dot"></span>Aktif</span>':'<span class="ap-badgeap-b-mute"><span class="ap-dot"></span>Duraklatıldı</span>';
return '<div class="ap-agent"><div class="ap-agent-top">'+avatarHtml(a.id)+'<div style="flex:1;min-width:0"><div class="ap-agent-name">'+esc(a.name)+'</div><div class="ap-agent-role">'+esc(a.role)+'</div></div>'+st+'</div>'
+'<div class="ap-agent-meta"><span class="ap-badgeap-b-violet">'+esc(a.model)+'</span><span class="ap-badgeap-b-mute">%'+a.success+' başarı</span></div>'
+'<div class="ap-perms">'+permChips(a)+'</div>'
+'<div class="ap-agent-stats"><span><b>'+a.runs+'</b> çalışma</span><span><b>'+a.tools.length+'</b> araç</span><span style="margin-left:auto">'+(a.perms.publish?'<span style="color:var(--ap-green)">otonom yayın</span>':'<span style="color:var(--ap-amber)">onaylı yayın</span>')+'</span></div>'
+'<div class="ap-agent-actions"><button type="button" class="ap-btn ap-btn-sm ap-btn-primary" data-action="run-agent" data-agent="'+a.id+'">'+ic('play')+'Çalıştır</button><button type="button" class="ap-btn ap-btn-sm" data-action="agent-detail" data-agent="'+a.id+'">Detay</button><button type="button" class="ap-btn ap-btn-sm" data-action="agent-toggle" data-agent="'+a.id+'">'+(a.status==='active'?ic('pause')+'Duraklat':ic('play')+'Aktifleştir')+'</button></div></div>';}

function agentDetailHtml(){var a=agentById(state.agentDetail);if(!a)return '';var defs=[['create','İçerik üretimi','Yeni taslak oluşturabilir'],['edit','Düzenleme','Mevcut içeriği güncelleyebilir'],['publish','Yayınlama','Onaysız yayına alabilir'],['commerce','Fiyat / stok','Pazaryeri fiyat ve stok değişikliği']];
var perms=defs.map(function(d){return '<label class="ap-ctl-row"><input type="checkbox" data-action="perm" data-agent="'+a.id+'" data-perm="'+d[0]+'"'+(a.perms[d[0]]?' checked':'')+'><span><b style="font-weight:500">'+d[1]+'</b><br><span style="font-size:11px;color:var(--ap-muted)">'+d[2]+(a.perms[d[0]]?'':' — kapalıyken insan onayı gerekir')+'</span></span></label>';}).join('');
var recent=state.tasks.filter(function(t){return t.agent===a.id;}).slice(0,4).map(function(t){return '<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--ap-border);font-size:12px"><span style="flex:1">'+esc(t.title)+'</span>'+taskBadge(t.status)+'</div>';}).join('')||'<div class="ap-empty">Henüz görev yok.</div>';
return '<div class="ap-panel"><div class="ap-panel-h"><span class="ap-panel-t">'+avatarHtml(a.id)+'&nbsp;'+esc(a.name)+' — yetki ve guardrail</span><button type="button" class="ap-btn ap-btn-sm" data-action="agent-close">'+ic('x')+'</button></div><div class="ap-panel-b" style="display:flex;flex-direction:column;gap:13px"><div class="ap-grid2e"><div><div style="font-size:11.5px;color:var(--ap-muted);font-weight:500;margin-bottom:7px">YETKİLER (PERMISSIONS)</div><div style="display:flex;flex-direction:column;gap:9px">'+perms+'</div></div><div><div style="font-size:11.5px;color:var(--ap-muted);font-weight:500;margin-bottom:7px">ARAÇLAR / SKILLS</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+a.tools.map(function(t){return '<span class="ap-badgeap-b-violet">'+ic('spark')+esc(t)+'</span>';}).join('')+'</div><div style="font-size:11.5px;color:var(--ap-muted);font-weight:500;margin:13px 0 7px">SON GÖREVLER</div>'+recent+'</div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button type="button" class="ap-btn ap-btn-primary" data-action="run-agent" data-agent="'+a.id+'">'+ic('play')+'Şimdi çalıştır</button><span class="ap-sub" style="align-self:center">Model: '+esc(a.model)+' · MCP üzerinden araç çağrısı</span></div></div></div>';}

function viewAgents(){return '<div class="ap-head"><div><h1 class="ap-h1">'+ic('bot')+'Agent Filosu</h1><p class="ap-sub">Her agent’ın modeli, araçları (skills) ve yetki sınırları (guardrails) ayrı yönetilir.</p></div><span class="ap-badgeap-b-violet">'+ic('shield')+'least-privilege varsayılan</span></div>'
+'<div class="ap-agents-grid">'+state.agents.map(agentCardHtml).join('')+'</div>'
+(state.agentDetail?agentDetailHtml():'');}

function taskHtml(t){var a=agentById(t.agent);var open=state.openLogs[t.id];var logHtml=open?'<div class="ap-log">'+t.log.map(function(l){var cls=l.indexOf('Guardrail')>-1?'lg-warn':l.indexOf('✓')>-1||l.indexOf('tamamlandı')>-1?'lg-ok':l.indexOf('hata')>-1?'lg-err':'';return '<div class="'+cls+'">'+esc(l)+'</div>';}).join('')+'</div>':'';
var actions='';
if(t.status==='approval'){actions='<button type="button" class="ap-btn ap-btn-sm ap-btn-primary" data-action="task-approve" data-task="'+t.id+'">'+ic('check')+'Onayla</button><button type="button" class="ap-btn ap-btn-sm ap-btn-danger" data-action="task-reject" data-task="'+t.id+'">'+ic('x')+'Reddet</button>';}
else if(t.status==='failed'){actions='<button type="button" class="ap-btn ap-btn-sm" data-action="task-retry" data-task="'+t.id+'">'+ic('refresh')+'Yeniden dene</button>';}
else if(t.status==='queued'||t.status==='running'){actions='<button type="button" class="ap-btn ap-btn-sm ap-btn-danger" data-action="task-cancel" data-task="'+t.id+'">'+ic('x')+'İptal</button>';}
var pct=Math.round(t.progress);
return '<div class="ap-task '+t.status+'"><div class="ap-task-top"><span class="ap-task-agent">'+avatarHtml(t.agent)+esc(a?a.name:t.agent)+'</span><span class="ap-task-title">'+esc(t.title)+'</span><span class="ap-badgeap-b-mute">'+(KIND_LABEL[t.kind]||t.kind)+'</span>'+taskBadge(t.status)+'</div>'
+(t.status==='running'||t.status==='queued'||t.status==='approval'?'<div class="ap-progress"><div class="ap-progress-bar" style="width:'+pct+'%"></div></div>':'')
+'<div class="ap-task-actions">'+actions+'<button type="button" class="ap-btn ap-btn-sm" data-action="task-log" data-task="'+t.id+'">'+ic('down')+(open?'Logu gizle':'Log ('+t.log.length+')')+'</button><span style="margin-left:auto;font-size:11px;color:var(--ap-muted)">'+rel(t.ts)+(t.needsApproval?' · '+ic('shield')+' guardrail':'')+'</span></div>'+logHtml+'</div>';}

function tasksListHtml(){var f=state.taskFilter;var list=state.tasks.filter(function(t){if(f==='all')return true;if(f==='approval')return t.status==='approval';if(f==='active')return t.status==='running'||t.status==='queued';if(f==='done')return t.status==='done'||t.status==='failed'||t.status==='rejected';return true;});
if(list.length===0)return '<div class="ap-empty">Bu filtrede görev yok.</div>';
return '<div style="display:flex;flex-direction:column;gap:10px">'+list.map(taskHtml).join('')+'</div>';}

function viewTasks(){var counts={all:state.tasks.length,approval:pendingCount(),active:state.tasks.filter(function(t){return t.status==='running'||t.status==='queued';}).length,done:state.tasks.filter(function(t){return t.status==='done'||t.status==='failed'||t.status==='rejected';}).length};
var chips=[['all','Tümü'],['active','Çalışan / kuyruk'],['approval','Onay bekleyen'],['done','Sonuçlanan']].map(function(c){return '<button type="button" class="ap-chip'+(state.taskFilter===c[0]?' on':'')+'" data-action="tfilter" data-f="'+c[0]+'">'+c[1]+' ('+counts[c[0]]+')</button>';}).join('');
return '<div class="ap-head"><div><h1 class="ap-h1">'+ic('queue')+'Görev Kuyruğu</h1><p class="ap-sub">Agent görevleri canlı ilerler; guardrail’e takılanlar insan onayı bekler.</p></div><span class="ap-badgeap-b-violet">'+ic('clock')+'otomatik yenilenir</span></div>'
+'<div class="ap-saved">'+chips+'</div><div id="ap-tasks-list">'+tasksListHtml()+'</div>';}

function themeVars(){var t=state.theme;var dark=t.dark;var bg=dark?'#181310':'#faf6f0';var surface=dark?'#241d17':'#ffffff';var text=dark?'#f3ece3':'#2b2119';var muted=dark?'#b5a898':'#7d7062';var border=dark?'#3c3226':'#e9dfd2';var soft=dark?'#2e251c':'#f4e9dc';var density=t.density==='sıkı'?0.72:1;var dur=t.speed<=0?'0ms':Math.round(6000*(100/t.speed))+'ms';
return '--pv-primary:'+t.primary+';--pv-accent:'+t.accent+';--pv-bg:'+bg+';--pv-surface:'+surface+';--pv-text:'+text+';--pv-muted:'+muted+';--pv-border:'+border+';--pv-soft:'+soft+';--pv-radius:'+t.radius+'px;--pv-density:'+density+';--pv-dur:'+dur+';background:'+bg+';color:'+text+';font-size:'+(13*t.scale/100).toFixed(1)+'px;';}

function cupSvg(){return '<svg class="pv-cup" viewBox="0 0 200 170" aria-hidden="true"><defs><linearGradient id="pv-cup-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--pv-primary)"/><stop offset="1" stop-color="var(--pv-accent)"/></linearGradient></defs><ellipse cx="100" cy="150" rx="72" ry="12" fill="var(--pv-soft)"/><path d="M45 60h95v45a47.5 47.5 0 0 1-95 0z" fill="url(#pv-cup-g)"/><path d="M140 68h14a17 17 0 0 1 0 34h-16" fill="none" stroke="var(--pv-primary)" stroke-width="8" stroke-linecap="round"/><ellipse cx="92.5" cy="60" rx="47.5" ry="9" fill="var(--pv-accent)" opacity=".85"/><path d="M75 34c0-9 8-9 8-18M95 38c0-9 8-9 8-18M115 34c0-9 8-9 8-18" fill="none" stroke="var(--pv-muted)" stroke-width="5" stroke-linecap="round" opacity=".6"/></svg>';}

function previewHtml(){var t=state.theme;var products=state.posts.filter(function(p){return p.type==='product'&&p.status==='published';});var posts=publishedPosts().filter(function(p){return p.type==='post';}).sort(function(a,b){return b.date-a.date;}).slice(0,3);
var prodCards=products.map(function(p){return '<div class="pv-card"><div class="pv-bag">'+ic('coffee')+'</div><h4>'+esc(p.title)+'</h4><p>'+esc(p.excerpt)+'</p><div class="pv-price-row"><span class="pv-price">'+money(p.price)+'</span><button type="button" class="pv-add" data-action="pv-cart" data-id="'+p.id+'">'+ic('cart')+'Sepete ekle</button></div></div>';}).join('');
var postCards=posts.map(function(p){return '<button type="button" class="pv-post" data-action="pv-link" data-label="'+esc(p.title)+'"><span class="pv-post-date">'+dstr(p.date)+'</span><span style="flex:1;min-width:0"><h4>'+esc(p.title)+(p.en?' <span style="font-size:.75em;color:var(--pv-primary)">EN</span>':'')+'</h4><p>'+esc(p.excerpt)+'</p></span></button>';}).join('');
return '<div id="pv-frame" class="'+(t.grid?'pv-grid-on':'')+'" style="'+themeVars()+'"><div class="pv-in">'
+'<div class="pv-head"><span class="pv-logo"><span class="pv-logo-mark">'+ic('coffee')+'</span>Köz Kahve</span><nav class="pv-nav"><button type="button" data-action="pv-link" data-label="Mağaza">Mağaza</button><button type="button" data-action="pv-link" data-label="Blog">Blog</button><button type="button" data-action="pv-link" data-label="Hakkımızda">Hakkımızda</button></nav><button type="button" class="pv-cart" data-action="pv-link" data-label="Sepet">'+ic('cart')+'Sepet <b id="pv-cart-n">'+state.cart+'</b></button></div>'
+'<div class="pv-hero pv-hero--'+t.hero+'"><div><span class="pv-hero-kicker">'+ic('spark')+'Küçük parti · doğrudan ticaret</span><h2>Üçüncü nesil kahve, <em>doğru kavurma.</em></h2><p>Çekirdekten fincana izlenebilir tedarik; her parti için ayrı kavurma profili. Astro ile statik, hızlı ve agent’larla yönetilen bir mağaza.</p><div><button type="button" class="pv-cta" data-action="pv-link" data-label="Ürünler">Ürünleri keşfet</button><button type="button" class="pv-cta2" data-action="pv-link" data-label="Blog">Blog’a göz at</button></div></div><div class="pv-hero-art">'+cupSvg()+'</div></div>'
+'<div class="pv-sec-h"><h3>Öne çıkan çekirdekler</h3><span>'+products.length+' ürün · stoklar pazaryerleriyle senkron</span></div><div class="pv-products">'+prodCards+'</div>'
+'<div class="pv-sec-h"><h3>Blog’dan son yazılar</h3><span>içerikler agent + insan ortak üretimi</span></div><div class="pv-posts">'+postCards+'</div>'
+'<div class="pv-foot"><span>© 2026 Köz Kahve · <b>AstroPress</b> ile yönetiliyor</span><span>build: statik · islands: hidratlı · agent: 5 aktif</span></div>'
+'</div></div>';}

return '<div class="ap-controls"><div class="ap-controls-h">'+ic('sliders')+'Tema Stüdyosu <span style="margin-left:auto;font-size:11px;color:var(--ap-muted)">canlı uygulanır</span></div>'
+'<div class="ap-ctl"><label for="tc-primary">Ana renk</label><input id="tc-primary" type="color" data-tfield="primary" value="'+t.primary+'"></div>'

function createTask(kind,agentId,payload,title){var a=agentById(agentId);var needs=false;if(kind==='publish'&&!a.perms.publish)needs=true;if(kind==='sync-products'&&!a.perms.commerce)needs=true;var t={id:uid('t'),agent:agentId,kind:kind,title:title,status:'queued',progress:0,log:[],needsApproval:needs,payload:payload||{},ts:now()};logLine(t,'Görev oluşturuldu: '+(KIND_LABEL[kind]||kind));if(needs)logLine(t,'Guardrail: bu işlem için yetki kapalı → onay gerekecek','lg-warn');state.tasks.unshift(t);pushActivity('bot',a.name+' görevi kuyruğa alındı: '+title,'violet');pushToast('Görev kuyruğa eklendi: '+title,'info');renderBadges();if(state.view==='tasks')renderTasksList();if(state.view==='dashboard')renderMain();return t;}

'sync-products':['Trendyol API: stoklar çekiliyor','Hepsiburada API: fiyatlar karşılaştırılıyor','Farklar hesaplanıyor','Guardrail kontrolü yapılıyor','✓ Senkron tamamlandı'],
'translate':['Kaynak metin ayrıştırılıyor','i18n sözlüğü uygulanıyor','Çeviri üretiliyor','Kalite kontrol yapılıyor','✓ EN sürümü hazır'],
'optimize-images':['Görseller taranıyor','WebP/AVIF dönüşümü','Alt text üretiliyor','CDN önbelleği yenileniyor','✓ Optimizasyon tamamlandı'],

'improve-post':['İçerik analiz ediliyor','SEO önerileri uygulanıyor','Meta alanları güncelleniyor','✓ İyileştirme tamamlandı'],

};

function applyEffect(t){var a=agentById(t.agent);var kind=t.kind;var msg='';
if(kind==='create-post'){var title=(t.payload&&t.payload.title)||'Yeni taslak: '+new Date().toLocaleDateString('tr-TR');var np={id:uid('p'),title:title,type:(t.payload&&t.payload.type)||'post',status:'draft',author:'Agent · '+a.name,date:now(),views:0,excerpt:'Agent tarafından üretildi — insan incelemesi bekliyor. Konu: '+title.toLocaleLowerCase('tr-TR')+'.',seo:{title:'',desc:''},en:false,imgOpt:false};state.posts.unshift(np);msg='“'+title+'” taslağı oluşturuldu';pushActivity('edit',a.name+' yeni taslak oluşturdu: '+title,'violet');}
else if(kind==='improve-post'){var p=postById(t.payload.postId);if(p){p.seo.title=p.title+' | Köz Kahve';p.seo.desc='Optimize edildi: '+p.excerpt.slice(0,110);msg='“'+p.title+'” SEO alanları iyileştirildi';pushActivity('chart',a.name+' içeriği iyileştirdi: '+p.title,'green');}}
else if(kind==='seo-audit'){var n=0;publishedPosts().forEach(function(p){if(!p.seo.desc||p.seo.desc.length<40){p.seo.desc='Optimize: '+p.excerpt.slice(0,110);n+=1;}});msg=n>0?n+' içeriğin meta açıklaması güncellendi':'Meta açıklamalar tarandı — tümü yeterli uzunlukta';pushActivity('chart',a.name+' SEO denetimi: '+msg,'green');}
else if(kind==='sync-products'){var target=null;state.posts.forEach(function(p){if(p.type==='product'&&p.status==='published'&&!target)target=p;});if(target&&t.payload&&t.payload.price){target.price=t.payload.price;target.stock=Math.max(1,(target.stock||10));msg=target.title+' fiyatı '+money(target.price)+' olarak güncellendi';}else{var c=0;state.posts.forEach(function(p){if(p.type==='product'){p.stock=(p.stock||0)+Math.floor(Math.random()*6);c+=1;}});msg=c+' ürünün stok bilgisi pazaryerleriyle eşitlendi';}pushActivity('box',a.name+': '+msg,'flame');}
else if(kind==='translate'){var tn=0;publishedPosts().forEach(function(p){if(!p.en&&tn<3){p.en=true;tn+=1;}});msg=tn+' içeriğin EN sürümü hazırlandı';pushActivity('globe',a.name+' çeviri: '+msg,'green');}
else if(kind==='optimize-images'){var on=0;state.posts.forEach(function(p){if(!p.imgOpt){p.imgOpt=true;on+=1;}});msg=on+' görsel WebP/AVIF’e dönüştürüldü, alt text eklendi';pushActivity('eye',a.name+': '+msg,'green');}
else if(kind==='publish'){var pp=postById(t.payload.postId);if(pp){pp.status='published';msg='“'+pp.title+'” yayınlandı';pushActivity('check','Yayınlandı: '+pp.title,'green');}}
else if(kind==='report'){var pub=publishedPosts().length;var views=state.posts.reduce(function(s,p){return s+p.views;},0);msg='Rapor: '+pub+' yayında içerik, '+views.toLocaleString('tr-TR')+' görüntülenme, '+pendingCount()+' bekleyen onay';pushActivity('chart',msg,'violet');}
if(msg)pushToast(a.name+': '+msg,'ok');
if(state.view==='content')renderContentList();
if(state.view==='dashboard')renderMain();
if(state.view==='studio')renderPreview();
}

function completeTask(t){t.status='done';t.progress=100;logLine(t,'✓ Görev tamamlandı');applyEffect(t);var a=agentById(t.agent);if(a){a.runs+=1;}renderBadges();if(state.view==='tasks')renderTasksList();}

var tickN=0;
function tick(){tickN+=1;var running=0;state.tasks.forEach(function(t){if(t.status==='running')running+=1;});
state.tasks.forEach(function(t){
if(t.status==='queued'&&running<2){var qa=agentById(t.agent);if(qa&&qa.status==='active'){t.status='running';running+=1;logLine(t,'Çalışma başladı — model: '+qa.model);}else if(t.log.length<2){logLine(t,'Agent duraklatılmış — kuyrukta bekliyor','lg-warn');}}
else if(t.status==='running'){t.progress=Math.min(100,t.progress+6+Math.random()*12);var pool=LOG_POOLS[t.kind]||LOG_POOLS['report'];var idx=Math.min(pool.length-1,Math.floor(t.progress/100*pool.length));if(t.log.length<idx+2){logLine(t,pool[idx]);}
if(t.progress>=100){if(t.needsApproval){t.status='approval';logLine(t,'Guardrail: insan onayı bekleniyor','lg-warn');pushToast('Onay bekliyor: '+t.title,'warn');pushActivity('shield','Onay kuyruğu: '+t.title,'amber');}else{completeTask(t);}}}
});
if(state.build.status==='building'){state.build.step+=1;var steps=['→ İçerik koleksiyonları okunuyor (src/content)','→ 42 sayfa derleniyor (statik HTML)','→ Adalar (islands) hidrate ediliyor','→ Görseller optimize ediliyor (WebP/AVIF)','✓ Build tamamlandı — dist/ hazır','✓ Deploy: kozkahve.com güncellendi'];if(state.build.step<=steps.length){state.build.log.push(steps[state.build.step-1]);if(state.build.log.length>8)state.build.log.shift();}if(state.build.step>=steps.length){state.build.status='done';state.build.last=(0.6+Math.random()*0.6).toFixed(2)+'s';state.build.pages=state.posts.length+30;pushToast('Astro build tamamlandı: '+state.build.pages+' sayfa, '+state.build.last,'ok');pushActivity('zap','Astro build: '+state.build.pages+' sayfa, '+state.build.last,'flame');}}
if(state.view==='tasks')renderTasksList();
if(state.view==='dashboard')renderDashDynamic();
renderBadges();renderSideBuild();
}

function runBuild(){if(state.build.status==='building')return;state.build.status='building';state.build.step=0;state.build.log=['[build] astro build başlatıldı…'];pushActivity('zap','Astro build başlatıldı','flame');if(state.view==='dashboard')renderMain();renderSideBuild();pushToast('Astro build başlatıldı — statik çıktı derleniyor','info');}

function defaultTaskFor(agentId){var a=agentById(agentId);if(agentId==='writer')return{kind:'create-post',payload:{title:'Yeni yazı: evde espresso demleme rehberi'},title:'Taslak üret: evde espresso demleme rehberi'};if(agentId==='seo')return{kind:'seo-audit',payload:{},title:'SEO denetimi: tüm yayında içerik'};if(agentId==='sync')return{kind:'sync-products',payload:{},title:'Pazaryeri senkronu: stok + fiyat'};if(agentId==='translate')return{kind:'translate',payload:{},title:'TR→EN çeviri: yayında içerikler'};return{kind:'optimize-images',payload:{},title:'Görsel optimizasyonu: ürün görselleri'};}

function runAgent(agentId){var a=agentById(agentId);if(!a)return;if(a.status!=='active'){pushToast(a.name+' duraklatılmış — önce aktifleştirin','warn',{label:'Aktifleştir',type:'activate',agent:agentId});return;}var d=defaultTaskFor(agentId);createTask(d.kind,agentId,d.payload,d.title);}

function parseCommand(text){var s=text.toLocaleLowerCase('tr-TR');var titleMatch=text.split(':');var freeTitle=titleMatch.length>1?titleMatch.slice(1).join(':').trim():'';
if(/(seo|meta|denetim)/.test(s))return{kind:'seo-audit',agent:'seo',payload:{},title:'SEO denetimi: tüm yayında içerik'};
if(/(çevir|translate|ingilizce|en sürüm)/.test(s))return{kind:'translate',agent:'translate',payload:{},title:'TR→EN çeviri: yayında içerikler'};
if(/(senkron|trendyol|hepsiburada|stok|fiyat|pazaryeri)/.test(s))return{kind:'sync-products',agent:'sync',payload:{},title:'Pazaryeri senkronu: stok + fiyat'};
if(/(görsel|webp|avif|alt text|optimiz)/.test(s)&&!/(seo)/.test(s))return{kind:'optimize-images',agent:'visual',payload:{},title:'Görsel optimizasyonu'};
if(/(rapor|özet|durum|analiz)/.test(s))return{kind:'report',agent:'seo',payload:{},title:'Haftalık durum raporu'};
if(/(yayınla|publish)/.test(s)){var draft=null;state.posts.forEach(function(p){if(p.status==='draft'&&!draft)draft=p;});if(draft)return{kind:'publish',agent:'writer',payload:{postId:draft.id},title:'Yayınla: “'+draft.title+'”'};return{kind:'report',agent:'seo',payload:{},title:'Rapor (yayınlanacak taslak yok)'};}
var t=freeTitle||text.replace(/^(yeni\s+)?(yazı|blog|post|makale|içerik)\s*/i,'').trim()||'Agent taslağı';return{kind:'create-post',agent:'writer',payload:{title:t.charAt(0).toLocaleUpperCase('tr-TR')+t.slice(1)},title:'Taslak üret: '+t};}

function dispatchCommand(text){text=(text||'').trim();if(!text){pushToast('Bir komut yazın — örn. «yeni yazı: soğuk demleme»','warn');return;}var c=parseCommand(text);var a=agentById(c.agent);if(a.status!=='active'){pushToast(a.name+' duraklatılmış — komut çalıştırılamadı','warn',{label:'Aktifleştir ve çalıştır',type:'activate-run',agent:c.agent,cmd:text});return;}createTask(c.kind,c.agent,c.payload,c.title);pushActivity('spark','Komut: “'+text+'” → '+a.name,'violet');}

function savePost(){var titleEl=$('#ed-title');if(!titleEl)return;var title=titleEl.value.trim();if(!title){pushToast('Başlık boş olamaz','err');titleEl.focus();return;}var type=$('#ed-type').value;var status=$('#ed-status').value;var excerpt=$('#ed-excerpt').value.trim();var seot=$('#ed-seot').value.trim();var seod=$('#ed-seod').value.trim();
if(state.editing==='new'){var np={id:uid('p'),title:title,type:type,status:status,author:'İnsan',date:now(),views:0,excerpt:excerpt||'Özet girilmedi.',seo:{title:seot,desc:seod},en:false,imgOpt:false};if(type==='product'){np.price=350;np.stock=10;}state.posts.unshift(np);pushActivity('plus','Yeni içerik oluşturdu: '+title,'green');pushToast('İçerik oluşturuldu: '+title,'ok');}
else{var p=postById(state.editing);if(p){p.title=title;p.type=type;p.status=status;p.excerpt=excerpt;p.seo.title=seot;p.seo.desc=seod;pushActivity('edit','İçerik güncellendi: '+title,'violet');pushToast('İçerik güncellendi','ok');}}
state.editing=null;renderMain();}

function deletePosts(ids){var removed=[];ids.forEach(function(id){for(var i=0;i<state.posts.length;i++){if(state.posts[i].id===id){removed.push({post:state.posts[i],index:i});state.posts.splice(i,1);break;}}});if(removed.length===0)return;state.undo={items:removed};if(state.editing&&ids.indexOf(state.editing)>-1)state.editing=null;pushActivity('trash',removed.length+' içerik silindi','amber');pushToast(removed.length+' içerik silindi','warn',{label:'Geri al',type:'undo'});renderMain();}
function undoDelete(){if(!state.undo)return;state.undo.items.sort(function(a,b){return a.index-b.index;}).forEach(function(it){state.posts.splice(Math.min(it.index,state.posts.length),0,it.post);});pushToast(state.undo.items.length+' içerik geri alındı','ok');pushActivity('refresh','Silme geri alındı','green');state.undo=null;renderMain();}

function hslToHex(h,s,l){s/=100;l/=100;var k=function(n){return (n+h/30)%12;};var a=s*Math.min(l,1-l);var f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));};var toHex=function(x){return Math.round(255*x).toString(16).padStart(2,'0');};return '#'+toHex(f(0))+toHex(f(8))+toHex(f(4));}
function randomTheme(){var h=Math.floor(Math.random()*360);state.theme.primary=hslToHex(h,55,42);state.theme.accent=hslToHex((h+40)%360,70,58);state.theme.radius=Math.floor(Math.random()*20);state.theme.scale=95+Math.floor(Math.random()*20);state.theme.hero=['left','center','split'][Math.floor(Math.random()*3)];state.theme.dark=Math.random()>0.5;pushToast('Tema rastgele üretildi — önizlemeye uygulandı','info');}

function dispatch(action,el,ev){
if(action==='nav'){state.view=el.getAttribute('data-view');state.editing=null;renderMain();return;}
if(action==='build'){runBuild();return;}
if(action==='cmd-run'){var inp=$('#ap-cmd-input');dispatchCommand(inp.value);inp.value='';return;}
if(action==='cmd-chip'){var cmd=el.getAttribute('data-cmd');$('#ap-cmd-input').value=cmd;dispatchCommand(cmd);$('#ap-cmd-input').value='';return;}
if(action==='new-post'){state.view='content';state.editing='new';renderMain();return;}
if(action==='edit-post'){state.view='content';state.editing=el.getAttribute('data-id');renderMain();return;}
if(action==='cancel-edit'){state.editing=null;renderMain();return;}
if(action==='save-post'){savePost();return;}
if(action==='delete-post'){deletePosts([el.getAttribute('data-id')]);return;}
if(action==='improve-post'){var pid=el.getAttribute('data-id');var pp=postById(pid);createTask('improve-post','seo',{postId:pid},'İyileştir: “'+(pp?pp.title:pid)+'”');return;}
if(action==='bulk-toggle'){var bid=el.getAttribute('data-id');if(state.bulk[bid])delete state.bulk[bid];else state.bulk[bid]=true;renderMain();return;}
if(action==='bulk-all'){var list=filteredPosts();var allSel=list.every(function(p){return state.bulk[p.id];});list.forEach(function(p){if(allSel)delete state.bulk[p.id];else state.bulk[p.id]=true;});renderMain();return;}
if(action==='bulk-clear'){state.bulk={};renderMain();return;}
if(action==='bulk-publish'){var ids=Object.keys(state.bulk);ids.forEach(function(id){var p=postById(id);if(p)p.status='published';});state.bulk={};pushActivity('check',ids.length+' içerik yayınlandı','green');pushToast(ids.length+' içerik yayınlandı','ok');renderMain();return;}
if(action==='bulk-draft'){var ids2=Object.keys(state.bulk);ids2.forEach(function(id){var p=postById(id);if(p)p.status='draft';});state.bulk={};pushToast(ids2.length+' içerik taslağa alındı','info');renderMain();return;}
if(action==='bulk-delete'){deletePosts(Object.keys(state.bulk));state.bulk={};return;}
if(action==='toast-close'){removeToast(el.getAttribute('data-tid'));return;}
if(action==='toast-action'){var tid=el.getAttribute('data-tid');var toast=null;state.toasts.forEach(function(t){if(t.id===tid)toast=t;});if(toast&&toast.action){var ac=toast.action;removeToast(tid);if(ac.type==='undo')undoDelete();else if(ac.type==='activate'){var ag=agentById(ac.agent);if(ag){ag.status='active';pushToast(ag.name+' aktifleştirildi','ok');renderMain();}}else if(ac.type==='activate-run'){var ag2=agentById(ac.agent);if(ag2){ag2.status='active';dispatchCommand(ac.cmd);}}}return;}
if(action==='saved-view'){var name=el.getAttribute('data-sv');state.savedViews.forEach(function(sv){if(sv.name===name){state.filters=JSON.parse(JSON.stringify(sv.f));state.activeSaved=name;}});renderMain();return;}
if(action==='save-view'){var nm='Görünüm '+(state.savedViews.length-3);state.savedViews.push({name:nm,f:JSON.parse(JSON.stringify(state.filters))});state.activeSaved=nm;pushToast('Görünüm kaydedildi: '+nm,'ok');renderMain();return;}
if(action==='run-agent'){runAgent(el.getAttribute('data-agent'));return;}
if(action==='agent-detail'){state.agentDetail=el.getAttribute('data-agent');renderMain();return;}
if(action==='agent-close'){state.agentDetail=null;renderMain();return;}
if(action==='agent-toggle'){var at=agentById(el.getAttribute('data-agent'));if(at){at.status=at.status==='active'?'paused':'active';pushToast(at.name+(at.status==='active'?' aktifleştirildi':' duraklatıldı'),'info');pushActivity('bot',at.name+' '+(at.status==='active'?'aktifleştirildi':'duraklatıldı'),'violet');renderMain();}return;}
if(action==='task-approve'){var ta=taskById(el.getAttribute('data-task'));if(ta&&ta.status==='approval'){ta.status='running';ta.progress=70;ta.needsApproval=false;logLine(ta,'İnsan onayı verildi — uygulanıyor','lg-ok');pushActivity('shield','Onaylandı: '+ta.title,'green');pushToast('Görev onaylandı, uygulanıyor','ok');renderTasksList();renderBadges();}return;}
if(action==='task-reject'){var tr=taskById(el.getAttribute('data-task'));if(tr&&tr.status==='approval'){tr.status='rejected';logLine(tr,'İnsan tarafından reddedildi','lg-err');pushActivity('x','Reddedildi: '+tr.title,'amber');pushToast('Görev reddedildi','warn');renderTasksList();renderBadges();}return;}
if(action==='task-retry'){var tt=taskById(el.getAttribute('data-task'));if(tt){tt.status='queued';tt.progress=0;tt.log=[];logLine(tt,'Yeniden deneme kuyruğa alındı');renderTasksList();}return;}
if(action==='task-cancel'){var tc=taskById(el.getAttribute('data-task'));if(tc){tc.status='failed';logLine(tc,'Kullanıcı tarafından iptal edildi','lg-err');pushToast('Görev iptal edildi','warn');renderTasksList();}return;}
if(action==='task-log'){var tl=el.getAttribute('data-task');state.openLogs[tl]=!state.openLogs[tl];renderTasksList();return;}
if(action==='tfilter'){state.taskFilter=el.getAttribute('data-f');renderMain();return;}
if(action==='pv-reset'){state.theme=JSON.parse(JSON.stringify(THEME_DEFAULT));state.pvExport=false;pushToast('Tema varsayılana sıfırlandı','info');renderMain();return;}
if(action==='pv-random'){randomTheme();renderMain();return;}
if(action==='pv-export'){state.pvExport=!state.pvExport;renderMain();return;}
if(action==='pv-copy'){var json=JSON.stringify(state.theme,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(json).then(function(){pushToast('Tema JSON’u panoya kopyalandı','ok');},function(){pushToast('Kopyalama bu ortamda kısıtlı — JSON’u elle seçin','warn');});}else{pushToast('Pano erişimi yok — JSON’u elle seçin','warn');}return;}
if(action==='pv-cart'){state.cart+=1;var cn=$('#pv-cart-n');if(cn)cn.textContent=String(state.cart);var cp=postById(el.getAttribute('data-id'));pushToast('Sepete eklendi: '+(cp?cp.title:'ürün')+' · toplam '+state.cart,'ok');return;}
if(action==='pv-link'){pushToast('Önizleme gezinmesi: “'+el.getAttribute('data-label')+'” — statik çıktıda bu rota derlenir','info');return;}
}

root.addEventListener('click',function(e){var el=e.target.closest('[data-action]');if(!el)return;var action=el.getAttribute('data-action');if(action==='bulk-toggle'||action==='bulk-all'||action==='perm'){return;}dispatch(action,el,e);});
root.addEventListener('change',function(e){var el=e.target;if(el.matches('[data-action="bulk-toggle"]')){dispatch('bulk-toggle',el,e);return;}if(el.matches('[data-action="bulk-all"]')){dispatch('bulk-all',el,e);return;}if(el.matches('[data-action="perm"]')){var a=agentById(el.getAttribute('data-agent'));var key=el.getAttribute('data-perm');if(a){a.perms[key]=el.checked;pushToast(a.name+' yetkisi güncellendi: '+key+(el.checked?' (açık)':' (kapalı → onay gerekir)'),'info');pushActivity('shield',a.name+' yetki değişikliği: '+key,'amber');renderMain();}return;}
var tf=el.getAttribute('data-field');if(tf){if(tf==='f-status')state.filters.status=el.value;if(tf==='f-type')state.filters.type=el.value;if(tf==='f-sort')state.filters.sort=el.value;state.activeSaved='';renderContentList();return;}
var tfield=el.getAttribute('data-tfield');if(tfield){var val=el.type==='checkbox'?el.checked:el.value;if(tfield==='scale'||tfield==='radius'||tfield==='speed')val=Number(val);state.theme[tfield]=val;if(tfield==='density'||tfield==='hero'||tfield==='dark'||tfield==='grid'){renderPreview();}else{applyThemeVars();}return;}});
root.addEventListener('input',function(e){var el=e.target;if(el.getAttribute('data-field')==='q'){state.filters.q=el.value;state.activeSaved='';renderContentList();return;}
var tfield=el.getAttribute('data-tfield');if(tfield&&(el.type==='range'||el.type==='color')){var val=el.type==='range'?Number(el.value):el.value;state.theme[tfield]=val;applyThemeVars();var out=$('#to-'+tfield);if(out){out.textContent=val+(tfield==='scale'?'%':tfield==='radius'?'px':'%');}}
if(el.id==='ap-cmd-input'&&e.inputType==='insertLineBreak'){dispatchCommand(el.value);el.value='';}});
root.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='ap-cmd-input'){e.preventDefault();dispatchCommand(e.target.value);e.target.value='';}});
root.addEventListener('dragstart',function(e){var tr=e.target.closest('tr[data-id]');if(!tr)return;state.dragId=tr.getAttribute('data-id');tr.classList.add('ap-dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',state.dragId);}catch(err){}}});
root.addEventListener('dragover',function(e){var tr=e.target.closest('tr[data-id]');if(!tr||!state.dragId)return;e.preventDefault();tr.classList.add('ap-drop-target');});
root.addEventListener('dragleave',function(e){var tr=e.target.closest('tr[data-id]');if(tr)tr.classList.remove('ap-drop-target');});
root.addEventListener('drop',function(e){var tr=e.target.closest('tr[data-id]');if(!tr||!state.dragId)return;e.preventDefault();var targetId=tr.getAttribute('data-id');if(targetId!==state.dragId){var from=-1,to=-1;state.posts.forEach(function(p,i){if(p.id===state.dragId)from=i;if(p.id===targetId)to=i;});if(from>-1&&to>-1){var item=state.posts.splice(from,1)[0];state.posts.splice(to,0,item);state.filters.sort='manual';pushActivity('grip','İçerik sıralaması değiştirildi','violet');pushToast('Sıralama güncellendi (manuel)','info');renderMain();}}state.dragId=null;$all('tr.ap-drop-target').forEach(function(x){x.classList.remove('ap-drop-target');});});
root.addEventListener('dragend',function(){state.dragId=null;$all('tr.ap-dragging').forEach(function(x){x.classList.remove('ap-dragging');});$all('tr.ap-drop-target').forEach(function(x){x.classList.remove('ap-drop-target');});});

renderMain();
setInterval(tick,700);
})();
</script>
</div>
</body>
</html>
