name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astropress
          POSTGRES_PASSWORD: astropress
          POSTGRES_DB: astropress
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (astro)
        run: npm run build
      - name: Unit + integration tests
        run: npm test
      - name: End-to-end smoke (guardrail + RBAC + i18n)
        run: npm run smoke
      - name: MCP HTTP smoke (Streamable HTTP transport)
        run: npm run smoke:http
      - name: Backend deps + tests (NestJS sites slice + registry contract)
        run: npm run backend:ci
        env:
          DATABASE_URL: postgres://astropress:astropress@localhost:5432/astropress
          REDIS_URL: redis://localhost:6379